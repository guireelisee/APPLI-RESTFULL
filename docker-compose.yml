version: '3.8'

services:
  # ============================================
  # BASE DE DONNÉES SOURCE
  # ============================================
  db_source:
    image: postgres:15-alpine
    container_name: db_source
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_source
      POSTGRES_USER: laravel_user
      POSTGRES_PASSWORD: laravel_password
    ports:
      - "5434:5432"
    volumes:
      - db_source_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel_user -d db_source"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # BASE DE DONNÉES TARGET
  # ============================================
  db_target:
    image: postgres:15-alpine
    container_name: db_target
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_target
      POSTGRES_USER: laravel_user
      POSTGRES_PASSWORD: laravel_password
    ports:
      - "5435:5432"
    volumes:
      - db_target_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel_user -d db_target"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # ZOOKEEPER (requis pour Kafka)
  # ============================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper
    networks:
      - app_network

  # ============================================
  # KAFKA BROKER
  # ============================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ============================================
  # KAFKA UI (Interface web)
  # ============================================
  kafka_ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - app_network

  # ============================================
  # KAFKA PRODUCER (HTTP Service)
  # ============================================
  kafka_producer:
    build:
      context: ./kafka-producer
      dockerfile: Dockerfile
    container_name: kafka_producer
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "5001:5001"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - app_network
    volumes:
      - ./kafka-producer:/app

  # ============================================
  # KAFKA CONSUMER (Python ETL)
  # ============================================
  kafka_consumer:
    build:
      context: ./kafka-consumer
      dockerfile: Dockerfile
    container_name: kafka_consumer
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      db_target:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: laravel_etl_group
      DB_TARGET_HOST: db_target
      DB_TARGET_PORT: 5432
      DB_TARGET_DB: db_target
      DB_TARGET_USER: laravel_user
      DB_TARGET_PASSWORD: laravel_password
    networks:
      - app_network
    volumes:
      - ./kafka-consumer:/app

  # ============================================
  # POSTGRES EXPORTER - SOURCE
  # ============================================
  postgres_exporter_source:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter_source
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://laravel_user:laravel_password@db_source:5432/db_source?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      db_source:
        condition: service_healthy
    networks:
      - app_network

  # ============================================
  # POSTGRES EXPORTER - TARGET
  # ============================================
  postgres_exporter_target:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter_target
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://laravel_user:laravel_password@db_target:5432/db_target?sslmode=disable"
    ports:
      - "9188:9187"
    depends_on:
      db_target:
        condition: service_healthy
    networks:
      - app_network

  # ============================================
  # PROMETHEUS
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - app_network

  # ============================================
  # GRAFANA
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: ""
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/home.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_source_data:
  db_target_data:
  zookeeper_data:
  kafka_data:
  prometheus_data:
  grafana_data:
