version: '3.8'

services:
  # ============================================
  # BASE DE DONNÉES SOURCE
  # ============================================
  db_source:
    image: postgres:15-alpine
    container_name: db_source
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_source
      POSTGRES_USER: laravel_user
      POSTGRES_PASSWORD: laravel_password
    ports:
      - "5434:5432"
    volumes:
      - db_source_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel_user"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================
  # BASE DE DONNÉES TARGET
  # ============================================
  db_target:
    image: postgres:15-alpine
    container_name: db_target
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_target
      POSTGRES_USER: laravel_user
      POSTGRES_PASSWORD: laravel_password
    ports:
      - "5435:5432"
    volumes:
      - db_target_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel_user"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================
  # ZOOKEEPER
  # ============================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper

  # ============================================
  # KAFKA
  # ============================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ============================================
  # KAFKA CONSUMERS (dans Docker avec rdkafka)
  # ============================================
  kafka_consumers:
    image: php:8.3-cli-alpine
    container_name: kafka_consumers
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db_source
      - db_target
      - kafka
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db_source
      DB_PORT: 5432
      DB_DATABASE: db_source
      DB_USERNAME: laravel_user
      DB_PASSWORD: laravel_password
      DB_CONNECTION_SECOND: pgsql
      DB_HOST_SECOND: db_target
      DB_PORT_SECOND: 5432
      DB_DATABASE_SECOND: db_target
      DB_USERNAME_SECOND: laravel_user
      DB_PASSWORD_SECOND: laravel_password
      KAFKA_BROKERS: kafka:9092
    entrypoint: /bin/sh
    command: |
      -c "
      apk add --no-cache librdkafka-dev postgresql-dev autoconf g++ make &&
      docker-php-ext-install pdo pdo_pgsql &&
      pecl install rdkafka &&
      docker-php-ext-enable rdkafka &&
      php artisan kafka:consume-clients &
      php artisan kafka:consume-reservations &
      wait
      "

  # ============================================
  # KAFKA UI
  # ============================================
  kafka_ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  # ============================================
  # PROMETHEUS
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # ============================================
  # GRAFANA
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  db_source_data:
  db_target_data:
  zookeeper_data:
  kafka_data:
  prometheus_data:
  grafana_data:
